name: Nocta
options:
  bundleIdPrefix: app.nocta
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode: ScriptingBridge is an untyped Objective-C forwarding API and
    # fights Swift 6 strict concurrency for no practical safety gain here.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # No Developer ID on this machine, so builds are ad-hoc signed.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.4.0"

targets:
  Nocta:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: Nocta
        PRODUCT_BUNDLE_IDENTIFIER: app.nocta.Nocta
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/Nocta.entitlements
        COMBINE_HIDPI_IMAGES: YES

  NoctaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NoctaTests
    dependencies:
      - target: Nocta
    settings:
      base:
        PRODUCT_NAME: Nocta
        PRODUCT_NAME: NoctaTests
        PRODUCT_BUNDLE_IDENTIFIER: app.nocta.NoctaTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nocta.app/Contents/MacOS/Nocta"
        BUNDLE_LOADER: "$(TEST_HOST)"
